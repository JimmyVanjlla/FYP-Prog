# Runs the test suites on every push to main and on every pull request.
# Needs no secrets: the backend tests use an in-memory SQLite database, and the
# Flutter tests use a fake API. Nothing here deploys anything (Render is
# deployed by hand; see DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # The login rate limiter talks to Redis. It fails open without one, but
    # pays a connection timeout on every attempt, so give it a real one.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Prophet's wheel bundles an incomplete CmdStan folder that cmdstanpy
      # rejects before it can use the prebuilt model beside it.
      - run: python scripts/setup_windows_prophet.py
      - name: Run tests
        shell: bash
        run: python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      # Puts the failing test names on the run summary page, where they can be
      # read without opening the raw log.
      - name: Report failures
        if: failure()
        run: |
          python - <<'EOF'
          import pathlib
          text = pathlib.Path("pytest.log").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-60:])[-3500:]
          tail = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=pytest failed::{tail}")
          EOF

  prophet-diag:
    name: TEMP Prophet diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Load Prophet and report why it fails
        shell: bash
        run: |
          cat > diag.py <<'EOF'
          import importlib.metadata as m, logging, sys, traceback
          logging.basicConfig(level=logging.DEBUG, stream=sys.stdout)
          for p in ["prophet", "cmdstanpy", "stanio", "numpy", "pandas", "holidays"]:
              print(p, m.version(p))
          import os, prophet
          sm = os.path.join(os.path.dirname(prophet.__file__), "stan_model")
          print("stan_model dir:", sorted(os.listdir(sm)) if os.path.isdir(sm) else "MISSING")
          for root, _, files in os.walk(sm):
              for f in files:
                  if f.startswith("prophet_model") or f == "stanc" or f == "make":
                      print("  found", os.path.relpath(os.path.join(root, f), sm))
          try:
              from prophet.models import CmdStanPyBackend
              CmdStanPyBackend()
              print("CmdStanPyBackend OK")
          except Exception:
              traceback.print_exc(file=sys.stdout)
          EOF
          python scripts/setup_windows_prophet.py 2>&1 | tee diag.log
          cat >> diag.py <<'EOF'
          import pandas as pd
          from prophet import Prophet
          m = Prophet(uncertainty_samples=0, yearly_seasonality=False)
          m.fit(pd.DataFrame({"ds": pd.date_range("2026-01-01", periods=30), "y": range(30)}))
          print("PROPHET FIT OK, backend:", m.stan_backend.get_type())
          EOF
          python diag.py 2>&1 | tee -a diag.log || true
          python - <<'EOF'
          import pathlib
          t = "\n".join(pathlib.Path("diag.log").read_text(errors="replace").splitlines()[-45:])[-3800:]
          t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::warning title=prophet diag::{t}")
          EOF

  frontend:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.8"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
